services:
  db:
    # Shards restore the schema generated by the migration job and only need
    # PostgreSQL plus the extension referenced by that snapshot.
    image: postgres:15.19-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./e2e/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
