name: Main workflow

on:
  push:
    branches:
      - main
  pull_request:
  pull_request_target:
    types: [labeled]

# Keep pull_request_target label events from canceling pull_request checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  ssg-artifact:
    name: Packaged SSG Assets build
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')
    timeout-minutes: 5
    runs-on: ubuntu-24.04-arm
    environment:
      name: development

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/submodules-checkout
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}

      - uses: ./.github/actions/ci-setup

      - name: Build packaged SSG fixture
        run: pnpm --filter webstudio test:ssg-package

  tests:
    name: tests (${{ matrix.environment }}, ${{ matrix.suite.scope }})
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment:
          - empty
          - development
        suite:
          - scope: packages
          - scope: cli
          - scope: builder-core
            project: core-*
          - scope: builder-app
            project: app-*
    environment:
      name: ${{ matrix.environment }}
    env:
      DATABASE_URL: postgres://
      AUTH_SECRET: test

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/test-suite
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}
          scope: ${{ matrix.suite.scope }}
          project: ${{ matrix.suite.project }}

  checks:
    # Run on push, regular PR (for repo branches), or labeled PR with safe-to-deploy (for forks)
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')

    timeout-minutes: 5

    environment:
      name: empty

    env:
      DATABASE_URL: postgres://
      AUTH_SECRET: test

    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Pnpm install
        run: |
          pnpm install

      - run: |
          pnpm oxfmt --check

      - name: Lint
        run: |
          pnpm lint

      - name: Package boundaries
        run: |
          pnpm check:package-boundaries

      - name: Generated API contracts
        run: |
          pnpm check:generated-api

      - name: Generated CLI docs
        run: |
          pnpm check:generated-docs

      - name: Typecheck
        run: |
          pnpm -r typecheck

  check-size:
    # Run on push, regular PR (for repo branches), or labeled PR with safe-to-deploy (for forks)
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')

    timeout-minutes: 5

    runs-on: ubuntu-24.04-arm

    environment:
      name: development

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/submodules-checkout
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}

      - uses: ./.github/actions/ci-setup

      - run: pnpm --filter "{./fixtures/*}..." build

      - uses: actions/github-script@v8
        with:
          script: |
            const assertSize = async (directory, maxSize) => {
              let result = ''
              await exec.exec('du', ['-sk', directory], {
                silent: true,
                listeners: {
                  stdout: (data) => {
                    result += data.toString()
                  }
                }
              })
              const size = Number.parseInt(result, 10)
              return {
                passed: size <= maxSize,
                size,
                diff: size - maxSize,
                directory,
              }
            }
            const results = [
              await assertSize('./fixtures/ssg-cloudflare-pages/dist/client', 356),
              await assertSize('./fixtures/react-router-netlify/build/client', 376),
              await assertSize('./fixtures/webstudio-features/build/client', 3684),
            ]
            for (const result of results) {
              if (result.passed) {
                console.info(`${result.directory}: ${result.size}kB (${result.diff}kB)`)
              } else {
                console.info('')
                console.error(`${result.directory}: ${result.size}kB (+${result.diff}kB)`)
              }
            }
            if (results.some(result => result.passed === false)) {
              console.error('Some fixtures exceeded limits')
              process.exit(1)
            }

  builder-e2e-build:
    name: builder-e2e build
    # Run on push, regular PR (for repo branches), or labeled PR with safe-to-deploy (for forks)
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')

    timeout-minutes: 5

    runs-on: ubuntu-24.04

    environment:
      name: development

    outputs:
      shards: ${{ steps.build.outputs.shards }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: build
        uses: ./.github/actions/builder-e2e-build
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}

  supabase-migrations:
    name: Supabase migrations
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    environment:
      name: empty

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/ci-setup
        with:
          run-scripts: "true"

      - name: Apply migrations to Supabase PostgreSQL
        run: pnpm e2e:builder:check-supabase-migrations

  builder-e2e:
    name: builder-e2e (${{ matrix.shard }})
    # Run on push, regular PR (for repo branches), or labeled PR with safe-to-deploy (for forks)
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')

    timeout-minutes: 5

    needs: builder-e2e-build

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.builder-e2e-build.outputs.shards) }}

    environment:
      name: development

    env:
      BUILDER_E2E_COMPOSE_ARGS: "--env-file apps/builder/.env -f apps/builder/docker-compose.yaml -f apps/builder/docker-compose.e2e-shard.yaml"
      COMPOSE_PROJECT_NAME: builder-e2e
      E2E_BUILD_DATABASE_IMAGE: "false"
      E2E_COMPOSE_OVERRIDE_FILE: ${{ github.workspace }}/apps/builder/docker-compose.e2e-shard.yaml

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/builder-e2e-shard
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}
          shard: ${{ matrix.shard }}
          partition: ${{ matrix.partition }}
