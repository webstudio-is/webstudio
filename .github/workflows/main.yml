name: Main workflow

on:
  push:
    branches:
      - main
  pull_request:
  pull_request_target:
    types: [labeled]

# Keep pull_request_target label events from canceling pull_request checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  ssg-artifact:
    name: Packaged SSG Assets build
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')
    timeout-minutes: 5
    runs-on: ubuntu-24.04-arm
    environment:
      name: development

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy' }}

      - uses: ./.github/actions/submodules-checkout
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}

      - uses: ./.github/actions/ci-setup

      - name: Build packaged SSG fixture
        run: pnpm --filter webstudio test:ssg-package

  tests:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: empty
            scope: packages
          - environment: development
            scope: packages
          - environment: development
            scope: cli
          - environment: development
            scope: builder-core
            projects: server browser-builder-settings browser-builder-features
          - environment: development
            scope: builder-app
            projects: browser-builder-shared browser-shared-heavy browser-shared browser-canvas-dashboard
    environment:
      name: ${{ matrix.environment }}
    env:
      DATABASE_URL: postgres://
      AUTH_SECRET: test

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy' }}

      - uses: ./.github/actions/submodules-checkout
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}

      - uses: ./.github/actions/ci-setup

      - name: Cache Playwright browsers
        if: matrix.scope != 'cli'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: test-playwright-${{ matrix.scope }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            test-playwright-${{ matrix.scope }}-${{ runner.os }}-

      - name: Playwright init
        if: matrix.scope == 'packages'
        run: pnpm --filter @webstudio-is/sdk-components-animation exec playwright install chromium firefox

      - name: Chromium init
        if: startsWith(matrix.scope, 'builder-')
        run: pnpm --filter @webstudio-is/builder exec playwright install chromium

      - name: Test packages
        if: matrix.scope == 'packages'
        run: pnpm -r --filter "!@webstudio-is/builder" --filter "!webstudio" test

      - name: Test CLI
        if: matrix.scope == 'cli'
        run: pnpm --filter webstudio test

      - name: Test Builder
        if: startsWith(matrix.scope, 'builder-')
        run: |
          for project in ${{ matrix.projects }}; do
            pnpm --filter @webstudio-is/builder exec vitest run --project "$project"
          done

  checks:
    # Run on push, regular PR (for repo branches), or labeled PR with safe-to-deploy (for forks)
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')

    timeout-minutes: 5

    strategy:
      matrix:
        environment:
          - empty
          - development

    environment:
      name: ${{ matrix.environment }}

    env:
      DATABASE_URL: postgres://
      AUTH_SECRET: test

    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy' }}

      # Will not checkout submodules on empty environment, and will on development
      - uses: ./.github/actions/submodules-checkout
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Pnpm install
        run: |
          pnpm install

      - run: echo ===SHA USED=== ${{ github.event.pull_request.head.sha || github.sha }} # todo: remove after check whats happening on main

      - run: |
          pnpm oxfmt --check

      - name: Lint
        run: |
          pnpm lint

      - name: Package boundaries
        run: |
          pnpm check:package-boundaries

      - name: Generated API contracts
        run: |
          pnpm check:generated-api

      - name: Generated CLI docs
        run: |
          pnpm check:generated-docs

      - name: Typecheck
        run: |
          pnpm -r typecheck

  check-size:
    # Run on push, regular PR (for repo branches), or labeled PR with safe-to-deploy (for forks)
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')

    timeout-minutes: 5

    runs-on: ubuntu-24.04-arm

    environment:
      name: development

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy' }}

      - uses: ./.github/actions/submodules-checkout
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}

      - uses: ./.github/actions/ci-setup

      - run: pnpm --filter "{./fixtures/*}..." build

      - uses: actions/github-script@v8
        with:
          script: |
            const assertSize = async (directory, maxSize) => {
              let result = ''
              await exec.exec('du', ['-sk', directory], {
                silent: true,
                listeners: {
                  stdout: (data) => {
                    result += data.toString()
                  }
                }
              })
              const size = Number.parseInt(result, 10)
              return {
                passed: size <= maxSize,
                size,
                diff: size - maxSize,
                directory,
              }
            }
            const results = [
              await assertSize('./fixtures/ssg-cloudflare-pages/dist/client', 356),
              await assertSize('./fixtures/react-router-netlify/build/client', 376),
              await assertSize('./fixtures/webstudio-features/build/client', 3684),
            ]
            for (const result of results) {
              if (result.passed) {
                console.info(`${result.directory}: ${result.size}kB (${result.diff}kB)`)
              } else {
                console.info('')
                console.error(`${result.directory}: ${result.size}kB (+${result.diff}kB)`)
              }
            }
            if (results.some(result => result.passed === false)) {
              console.error('Some fixtures exceeded limits')
              process.exit(1)
            }

  builder-e2e-build:
    name: builder-e2e build
    # Run on push, regular PR (for repo branches), or labeled PR with safe-to-deploy (for forks)
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')

    timeout-minutes: 5

    runs-on: ubuntu-24.04

    environment:
      name: development

    outputs:
      shards: ${{ steps.shards.outputs.value }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy' }}

      - uses: ./.github/actions/submodules-checkout
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}

      - uses: ./.github/actions/ci-setup
        with:
          run-scripts: "true"

      - name: Discover builder e2e shards
        id: shards
        run: echo "value=$(pnpm --dir apps/builder exec tsx ./e2e/print-shards.ts)" >> "$GITHUB_OUTPUT"

      - name: Build builder and generated preview dependencies
        run: pnpm e2e:builder:build

      # Generate this from the current migrations for this workflow run only.
      # Shards consume the snapshot as a fast, disposable schema cache.
      - name: Generate builder e2e schema snapshot
        run: pnpm e2e:builder:refresh-schema-cache

      - name: Upload builder e2e prerequisites
        uses: actions/upload-artifact@v6
        with:
          name: builder-e2e-build
          retention-days: 7
          path: |
            apps/builder/build/server
            apps/builder/build/client/assets
            packages/*/lib
            .cache/builder-e2e/schema-*.sql

  builder-e2e:
    name: builder-e2e (${{ matrix.shard }})
    # Run on push, regular PR (for repo branches), or labeled PR with safe-to-deploy (for forks)
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')

    timeout-minutes: 5

    needs: builder-e2e-build

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.builder-e2e-build.outputs.shards) }}

    environment:
      name: development

    env:
      BUILDER_E2E_COMPOSE_ARGS: "--env-file apps/builder/.env -f apps/builder/docker-compose.yaml -f apps/builder/docker-compose.e2e-shard.yaml"
      E2E_BUILD_DATABASE_IMAGE: "false"
      E2E_COMPOSE_OVERRIDE_FILE: ${{ github.workspace }}/apps/builder/docker-compose.e2e-shard.yaml

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy' }}

      - uses: ./.github/actions/submodules-checkout
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}

      - uses: ./.github/actions/ci-setup
        with:
          run-scripts: "true"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: builder-e2e-playwright-${{ runner.os }}-${{ hashFiles('apps/builder/package.json', 'pnpm-lock.yaml') }}

      - name: Download builder e2e build
        uses: actions/download-artifact@v7
        with:
          name: builder-e2e-build
          path: .

      - name: Run builder e2e
        env:
          E2E_SKIP_BUILDER_BUILD: true
          E2E_TEST_SHARD: ${{ matrix.shard }}
        run: |
          args=(--workers=4)
          if [ -n "${{ matrix.partition }}" ]; then
            args+=(--shard="${{ matrix.partition }}")
          fi
          pnpm e2e:builder -- "${args[@]}"

      - name: Upload Builder e2e report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: builder-e2e-report-${{ matrix.shard }}
          retention-days: 7
          path: |
            apps/builder/playwright-report
            apps/builder/test-results/e2e

      - name: Print e2e service logs
        if: failure()
        run: docker compose $BUILDER_E2E_COMPOSE_ARGS logs

      - name: Stop e2e services
        if: always()
        run: docker compose $BUILDER_E2E_COMPOSE_ARGS down --volumes --remove-orphans
