name: Main workflow

on:
  push:
    branches:
      - main
  pull_request:
  pull_request_target:
    types: [labeled]

# cancel in-progress runs on new commits to same PR (gitub.event.number)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  ssg-artifact:
    name: Packaged SSG Assets build
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')
    timeout-minutes: 20
    runs-on: ubuntu-24.04-arm
    environment:
      name: development

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy' }}

      - uses: ./.github/actions/submodules-checkout
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}

      - uses: ./.github/actions/ci-setup

      - name: Build packaged SSG fixture
        run: pnpm --filter webstudio test:ssg-package

  static-checks:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')
    timeout-minutes: 3
    environment:
      name: development
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy' }}

      - uses: ./.github/actions/submodules-checkout
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}

      - uses: ./.github/actions/ci-setup

      - name: Format
        run: pnpm oxfmt --check

      - name: Lint and package boundaries
        run: pnpm lint && pnpm check:package-boundaries

      - name: Generated contracts and documentation
        run: pnpm check:generated-api && pnpm check:generated-docs

  tests:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')
    timeout-minutes: 3
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: empty
            scope: packages
          - environment: development
            scope: packages
          - environment: development
            scope: cli
    environment:
      name: ${{ matrix.environment }}
    env:
      DATABASE_URL: postgres://
      AUTH_SECRET: test

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy' }}

      - uses: ./.github/actions/submodules-checkout
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}

      - uses: ./.github/actions/ci-setup

      - name: Cache Playwright browsers
        if: matrix.scope == 'packages'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: test-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            test-playwright-${{ runner.os }}-

      - name: Playwright init
        if: matrix.scope == 'packages'
        run: pnpm --filter @webstudio-is/sdk-components-animation exec playwright install chromium firefox

      - name: Test packages
        if: matrix.scope == 'packages'
        run: pnpm -r --filter "!@webstudio-is/builder" --filter "!webstudio" test

      - name: Test CLI
        if: matrix.scope == 'cli'
        run: pnpm --filter webstudio test

  builder-tests:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')
    timeout-minutes: 3
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: server
            browser: false
          - project: browser-builder-settings
            browser: true
          - project: browser-builder-features
            browser: true
          - project: browser-builder-shared
            browser: true
          - project: browser-shared-heavy
            browser: true
          - project: browser-shared
            browser: true
          - project: browser-canvas-dashboard
            browser: true
    environment:
      name: development
    env:
      DATABASE_URL: postgres://
      AUTH_SECRET: test

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy' }}

      - uses: ./.github/actions/submodules-checkout
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}

      - uses: ./.github/actions/ci-setup

      - name: Cache Chromium
        if: matrix.browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: builder-test-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            builder-test-chromium-${{ runner.os }}-

      - name: Playwright init
        if: matrix.browser
        run: pnpm --filter @webstudio-is/builder exec playwright install chromium

      - name: Test Builder project
        run: pnpm --filter @webstudio-is/builder exec vitest run --project ${{ matrix.project }}

  typecheck:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')
    timeout-minutes: 3
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment: [empty, development]
    environment:
      name: ${{ matrix.environment }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy' }}

      - uses: ./.github/actions/submodules-checkout
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}

      - uses: ./.github/actions/ci-setup

      - name: Typecheck
        run: pnpm -r typecheck

  checks:
    if: |
      always() &&
      (github.event_name == 'push' ||
       github.event_name == 'pull_request' ||
       (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy'))
    needs: [static-checks, tests, builder-tests, typecheck]
    timeout-minutes: 1
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        environment: [empty, development]
    environment:
      name: ${{ matrix.environment }}

    steps:
      - name: Verify checks
        if: |
          needs.static-checks.result != 'success' ||
          needs.tests.result != 'success' ||
          needs.builder-tests.result != 'success' ||
          needs.typecheck.result != 'success'
        run: exit 1

  check-size:
    # Run on push, regular PR (for repo branches), or labeled PR with safe-to-deploy (for forks)
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')

    runs-on: ubuntu-24.04-arm

    environment:
      name: development

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy' }}

      - uses: ./.github/actions/submodules-checkout
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}

      - uses: ./.github/actions/ci-setup

      - run: pnpm --filter "{./fixtures/*}..." build

      - uses: actions/github-script@v8
        with:
          script: |
            const assertSize = async (directory, maxSize) => {
              let result = ''
              await exec.exec('du', ['-sk', directory], {
                silent: true,
                listeners: {
                  stdout: (data) => {
                    result += data.toString()
                  }
                }
              })
              const size = Number.parseInt(result, 10)
              return {
                passed: size <= maxSize,
                size,
                diff: size - maxSize,
                directory,
              }
            }
            const results = [
              await assertSize('./fixtures/ssg-cloudflare-pages/dist/client', 356),
              await assertSize('./fixtures/react-router-netlify/build/client', 376),
              await assertSize('./fixtures/webstudio-features/build/client', 3684),
            ]
            for (const result of results) {
              if (result.passed) {
                console.info(`${result.directory}: ${result.size}kB (${result.diff}kB)`)
              } else {
                console.info('')
                console.error(`${result.directory}: ${result.size}kB (+${result.diff}kB)`)
              }
            }
            if (results.some(result => result.passed === false)) {
              console.error('Some fixtures exceeded limits')
              process.exit(1)
            }

  builder-e2e-build:
    name: builder-e2e build
    # Run on push, regular PR (for repo branches), or labeled PR with safe-to-deploy (for forks)
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')

    timeout-minutes: 20

    runs-on: ubuntu-24.04

    environment:
      name: development

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy' }}

      - uses: ./.github/actions/submodules-checkout
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}

      - uses: ./.github/actions/ci-setup
        with:
          run-scripts: "true"

      - name: Build builder and generated preview dependencies
        run: pnpm e2e:builder:build

      # Generate this from the current migrations for this workflow run only.
      # Shards consume the snapshot as a fast, disposable schema cache.
      - name: Generate builder e2e schema snapshot
        run: pnpm e2e:builder:refresh-schema-cache

      - name: Upload builder e2e prerequisites
        uses: actions/upload-artifact@v6
        with:
          name: builder-e2e-build
          retention-days: 7
          path: |
            apps/builder/build/server
            apps/builder/build/client/assets
            packages/*/lib
            .cache/builder-e2e/schema-*.sql

  builder-e2e:
    name: builder-e2e (${{ matrix.shard }})
    # Run on push, regular PR (for repo branches), or labeled PR with safe-to-deploy (for forks)
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy')

    timeout-minutes: 40

    needs: builder-e2e-build

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    environment:
      name: development

    env:
      BUILDER_E2E_COMPOSE_ARGS: "--env-file apps/builder/.env -f apps/builder/docker-compose.yaml -f apps/builder/docker-compose.e2e.yaml"

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.label.name == 'safe-to-deploy' }}

      - uses: ./.github/actions/submodules-checkout
        with:
          submodules-ssh-key: ${{ secrets.PRIVATE_GITHUB_DEPLOY_TOKEN }}

      - uses: ./.github/actions/ci-setup
        with:
          run-scripts: "true"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: builder-e2e-playwright-${{ runner.os }}-${{ hashFiles('apps/builder/package.json', 'pnpm-lock.yaml') }}

      - name: Download builder e2e build
        uses: actions/download-artifact@v7
        with:
          name: builder-e2e-build
          path: .

      - name: Run builder e2e
        env:
          E2E_SKIP_BUILDER_BUILD: true
          E2E_TEST_COMMAND_TIMEOUT_SECONDS: 900
        run: |
          run_builder_e2e() {
            pnpm e2e:builder -- --shard=${{ matrix.shard }}/6
          }

          run_builder_e2e_keep_logs() {
            E2E_SKIP_CLEANUP=true pnpm e2e:builder -- --shard=${{ matrix.shard }}/6
          }

          run_builder_e2e || {
            echo "::warning::Builder e2e shard ${{ matrix.shard }} failed; retrying once with a clean backend"
            if [ -d apps/builder/playwright-report ]; then
              mv apps/builder/playwright-report apps/builder/playwright-report-attempt-1
            fi
            if [ -d apps/builder/test-results/e2e ]; then
              mv apps/builder/test-results/e2e apps/builder/test-results/e2e-attempt-1
            fi
            run_builder_e2e_keep_logs
          }

      - name: Upload initial Builder e2e failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: builder-e2e-report-${{ matrix.shard }}-attempt-1
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/builder/playwright-report-attempt-1
            apps/builder/test-results/e2e-attempt-1

      - name: Upload Builder e2e report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: builder-e2e-report-${{ matrix.shard }}
          retention-days: 7
          path: |
            apps/builder/playwright-report
            apps/builder/test-results/e2e

      - name: Print e2e service logs
        if: failure()
        run: docker compose $BUILDER_E2E_COMPOSE_ARGS logs

      - name: Stop e2e services
        if: always()
        run: docker compose $BUILDER_E2E_COMPOSE_ARGS down --volumes --remove-orphans
