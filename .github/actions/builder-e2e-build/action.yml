name: Build Builder E2E prerequisites

description: Build the Builder and package its E2E schema and dependencies.

inputs:
  submodules-ssh-key:
    description: SSH key for private E2E dependencies.
    required: false

outputs:
  shards:
    description: Filename-derived E2E shard matrix.
    value: ${{ steps.shards.outputs.value }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/submodules-checkout
      with:
        submodules-ssh-key: ${{ inputs.submodules-ssh-key }}

    - uses: ./.github/actions/ci-setup
      with:
        run-scripts: "true"

    - name: Discover shards
      id: shards
      shell: bash
      run: |
        shards=$(pnpm --dir apps/builder exec tsx ./e2e/print-shards.ts)
        echo "value=$shards" >> "$GITHUB_OUTPUT"

    - name: Build Builder
      shell: bash
      run: pnpm --filter @webstudio-is/builder build

    - name: Build generated React Router components
      shell: bash
      run: pnpm --filter @webstudio-is/sdk-components-react-router build

    - name: Identify schema snapshot
      id: schema
      shell: bash
      run: |
        ROOT_DIR="$PWD"
        source apps/builder/backend/lib.sh
        echo "fingerprint=$(builder_backend_schema_fingerprint)" >> "$GITHUB_OUTPUT"

    - name: Restore schema snapshot
      id: schema-cache
      uses: actions/cache/restore@v5
      with:
        path: .cache/builder-e2e/schema-${{ steps.schema.outputs.fingerprint }}.sql
        key: builder-e2e-schema-v1-${{ runner.os }}-${{ steps.schema.outputs.fingerprint }}

    - name: Generate schema snapshot
      if: steps.schema-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter @webstudio-is/builder e2e:schema-cache

    - name: Check schema snapshot
      shell: bash
      run: test -s ".cache/builder-e2e/schema-${{ steps.schema.outputs.fingerprint }}.sql"

    - name: Save schema snapshot
      if: steps.schema-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: .cache/builder-e2e/schema-${{ steps.schema.outputs.fingerprint }}.sql
        key: builder-e2e-schema-v1-${{ runner.os }}-${{ steps.schema.outputs.fingerprint }}

    - name: Upload prerequisites
      uses: actions/upload-artifact@v6
      with:
        name: builder-e2e-build
        retention-days: 7
        path: |
          apps/builder/build/server
          apps/builder/build/client/assets
          packages/*/lib
          .cache/builder-e2e/schema-*.sql
