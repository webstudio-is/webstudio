name: Run Builder E2E shard

description: Run one Builder E2E shard and preserve diagnostics on failure.

inputs:
  submodules-ssh-key:
    description: SSH key for private E2E dependencies.
    required: false
  shard:
    description: Playwright shard number.
    required: true
  shard-count:
    description: Total number of Playwright shards.
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/submodules-checkout
      with:
        submodules-ssh-key: ${{ inputs.submodules-ssh-key }}

    - uses: ./.github/actions/ci-setup
      with:
        run-scripts: "true"

    - name: Cache Playwright Chromium
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/ms-playwright/chromium-*
          ~/.cache/ms-playwright/chromium_headless_shell-*
          ~/.cache/ms-playwright/ffmpeg-*
        key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Download Builder E2E build
      uses: actions/download-artifact@v7
      with:
        name: builder-e2e-build
        path: .

    - name: Run Builder E2E
      shell: bash
      env:
        E2E_TEST_SHARD: ${{ inputs.shard }}
        E2E_TEST_SHARD_COUNT: ${{ inputs.shard-count }}
      run: pnpm --filter @webstudio-is/builder e2e:ci:shard -- --workers=4 --shard="$E2E_TEST_SHARD/$E2E_TEST_SHARD_COUNT"

    - name: Upload report
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: builder-e2e-report-${{ inputs.shard }}
        retention-days: 7
        path: |
          apps/builder/playwright-report
          apps/builder/test-results/e2e

    - name: Print service logs
      if: failure()
      shell: bash
      run: bash apps/builder/backend/run.sh snapshot logs

    - name: Stop services
      if: always()
      shell: bash
      run: bash apps/builder/backend/run.sh snapshot down --volumes --remove-orphans
