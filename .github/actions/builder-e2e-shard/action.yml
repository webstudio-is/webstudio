name: Run Builder E2E shard

description: Run one Builder E2E shard and preserve diagnostics on failure.

inputs:
  submodules-ssh-key:
    description: SSH key for private E2E dependencies.
    required: false
  shard:
    description: Filename-derived shard name.
    required: true
  partition:
    description: Optional Playwright partition within the selected files.
    required: false

runs:
  using: composite
  steps:
    - uses: ./.github/actions/submodules-checkout
      with:
        submodules-ssh-key: ${{ inputs.submodules-ssh-key }}

    - uses: ./.github/actions/ci-setup
      with:
        run-scripts: "true"

    - name: Cache Playwright Chromium
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/ms-playwright/chromium-*
          ~/.cache/ms-playwright/chromium_headless_shell-*
          ~/.cache/ms-playwright/ffmpeg-*
        key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Identify Builder build inputs
      id: build-key
      shell: bash
      run: |
        hash=$(bash .github/actions/builder-e2e-build/build-input-hash.sh)
        echo "hash=$hash" >> "$GITHUB_OUTPUT"

    - name: Restore Builder build
      id: build-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          apps/builder/build/server
          apps/builder/build/client/assets
          packages/*/lib
        key: builder-e2e-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-key.outputs.hash }}

    - name: Prepare Builder E2E
      shell: bash
      run: |
        # Prepare services and Chromium while a missing build is still running.
        TIMEFORMAT='[e2e:prepare] elapsed=%3Rs'
        time bash apps/builder/e2e/run.sh ci-shard-prepare

    - name: Wait for Builder E2E build
      if: steps.build-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        wait_started_at=$SECONDS
        deadline=$((wait_started_at + 7 * 60))
        while (( SECONDS < deadline )); do
          available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=builder-e2e-build" --jq '.artifacts | max_by(.id) | .expired == false')
          if [ "$available" = true ]; then
            exit 0
          fi
          # Check more often during normal builds without increasing the
          # maximum number of requests if the build never uploads.
          if (( SECONDS - wait_started_at < 40 )); then
            sleep 2
          else
            sleep 6
          fi
        done
        echo "Builder E2E build artifact was not uploaded within 7 minutes" >&2
        exit 1

    - name: Download Builder E2E build
      if: steps.build-cache.outputs.cache-hit != 'true'
      uses: actions/download-artifact@v7
      with:
        name: builder-e2e-build
        path: .
        # Use the same REST artifact lookup as the wait step.
        github-token: ${{ github.token }}

    - name: Verify Builder E2E build inputs
      if: steps.build-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BUILD_INPUT_HASH: ${{ steps.build-key.outputs.hash }}
      run: |
        if ! cmp -s <(printf '%s\n' "$BUILD_INPUT_HASH") apps/builder/build/e2e-build-input-hash; then
          echo "Builder E2E build artifact does not match this shard's build inputs." >&2
          exit 1
        fi

    - name: Check Builder build
      shell: bash
      run: |
        test -d apps/builder/build/server
        test -d apps/builder/build/client/assets
        test -f packages/sdk-components-react-router/lib/components.js

    - name: Run Builder E2E
      shell: bash
      env:
        E2E_TEST_SHARD: ${{ inputs.shard }}
        E2E_TEST_PARTITION: ${{ inputs.partition }}
      run: |
        # Select only the E2E test files. Playwright runs setup as a dependency.
        args=(--workers=3 'e2e/tests/')
        if [ -n "$E2E_TEST_PARTITION" ]; then
          args+=(--shard="$E2E_TEST_PARTITION")
        fi
        bash apps/builder/e2e/measure-resources.sh \
          bash apps/builder/e2e/run.sh ci-shard-test "${args[@]}"

    - name: Upload report
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: builder-e2e-report-${{ inputs.shard }}
        retention-days: 7
        path: |
          apps/builder/playwright-report
          apps/builder/test-results/e2e

    - name: Print service logs
      if: failure()
      shell: bash
      run: bash apps/builder/backend/run.sh snapshot logs

    - name: Stop services
      if: always()
      shell: bash
      run: bash apps/builder/backend/run.sh snapshot down --volumes --remove-orphans
